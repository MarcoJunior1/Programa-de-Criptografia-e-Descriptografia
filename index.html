<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>26 Chaves para a Nátaly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>26 Chaves para a Senhorita</h1>
    <p>Senhorita Boa Sorte, ache o deslocamento no qual  <br> X >= 0 e <26 </p>
        <h3>Se decifrar tudo ganha uma supresa também</h3>
    <label for="message">Mensagem:</label>
    <textarea id="message" rows="4" cols="50"></textarea>
    
    <label for="shift">Deslocamento:</label>
    <input type="number" id="shift" value="0">

    <button onclick="cifrar()">Criptografar</button>

    <h2>Mensagem Criptografada:</h2>
    <textarea id="cipheredMessage" rows="4" cols="50" readonly></textarea>
  </div>

  <script src="script.js"></script>
</body>
</html>
